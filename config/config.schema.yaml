$schema: "https://json-schema.org/draft/2020-12/schema"

type: object

properties:
    experiment:
        type: string
        description: Unique experiment identifier used to namespace results under results/<experiment>/.
    configfile:
        type: string
    samples:
        type: object
    mcool_resolutions:
        type: ["object", "null"]
        additionalProperties:
            type: array
            uniqueItems: true
            items:
                type: integer
    genome_versions:
        type: ["object", "null"]
        additionalProperties:
            type: string
    chromosome_list:
        type: array
        uniqueItems: true
        items:
            type: string
    caller_configs:
        type: array
        uniqueItems: true
        items:
            type: string
    majority_votes:
        type: object
        additionalProperties:
            type: object
            properties:
                caller_configs:
                    oneOf:
                        - type: string
                        - type: array
                          items:
                              type: string
                border_fraction_threshold:
                    type: number
            required:
                - caller_configs
                - border_fraction_threshold
    tad_borders:
        type: object
        additionalProperties:
            type: array
            prefixItems:
                - type: integer
                - type: integer
            unevaluatedItems: false
    snp_filters:
        type: object
    input_files:
        type: object
        properties:
            disgenet:
                type: string
            gwascatalog:
                type: string
            disease_ontology:
                type: string
            exp_factor_ontology:
                type: string
            sequence_ontology:
                type: string
            dbsnp_hg19:
                type: string
        additionalProperties:
            type: string
        required:
            - disgenet
            - gwascatalog
            - exp_factor_ontology
            - sequence_ontology
            - dbsnp_hg19
    annotation_sources:
        type: array
        items:
            type: string
    parameters:
        type: object
        properties:
            associated_gene_source:
                type: string
                enum: [mapped, reported]
            allow_snp_multiplicity_in_enrichment:
                type: boolean
            gwas_date_range:
                type: ["array", "null"]
                items:
                    type: ["string", "null"]
                minItems: 2
                maxItems: 2
            gwas_date_column:
                type: string
                enum: ["DATE ADDED TO CATALOG", "DATE"]
            enrichment_distribution:
                type: string
                enum: [binom, hypergeom]
            enrichment_null_model:
                type: string
                enum: [base_sample, snp_sample]
            main_dataset:
                type: string
                description: When referring to data from a multi-resolution dataset, use the format SAMPLEID__RESOLUTION (e.g., 4DNFIXGAEPB6__10000).
            snp_majority_vote_border_fraction_threshold:
                type: number
            snp_majority_vote_narrow:
                type: object
                properties:
                    caller_configs:
                        type: array
                        items:
                            type: string
                    border_fraction_threshold:
                        type: number
                required:
                    - caller_configs
                    - border_fraction_threshold
            supplementary_caller_config:
                type: string
            window_aggregation:
                type: object
                properties:
                    disease_fraction_threshold:
                        type: number
                    caller_configs:
                        type: ["array", "null"]
                        uniqueItems: true
                        items:
                            type: string
                    snp_count_threshold_list:
                        type: array
                        uniqueItems: true
                        items:
                            type: integer
                required:
                    - disease_fraction_threshold
                    - snp_count_threshold_list
            publication_figure_tad_source_filter:
                type: string
        required:
            - associated_gene_source
            - allow_snp_multiplicity_in_enrichment
            - enrichment_distribution
            - enrichment_null_model
            - main_dataset
            - window_aggregation
            - publication_figure_tad_source_filter
    sketch:
        type: object
        properties:
            region:
                type: array
                prefixItems:
                    - type: string
                    - type: integer
                    - type: integer
                unevaluatedItems: false
            data_source:
                type: string
                description: When referring to data from a multi-resolution dataset, use the format SAMPLEID__RESOLUTION (e.g., 4DNFIXGAEPB6__10000).
            caller_config:
                type: string
additionalProperties: false
required:
    - experiment
    - samples
    - chromosome_list
    - caller_configs
    - snp_filters
    - input_files
    - annotation_sources
    - parameters
