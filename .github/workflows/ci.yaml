name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Dry Run (< 1 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run snakefmt check
        run: uv run snakefmt --check .

      - name: Validate experiment configs against schema
        run: |
          uv run python -c "
          import glob, os, yaml, jsonschema
          schema = yaml.safe_load(open('config/config.schema.yaml'))
          base = yaml.safe_load(open('config/base.yaml'))
          for exp_file in glob.glob('config/experiments/*.yaml'):
              exp = yaml.safe_load(open(exp_file))
              merged = {**base, **exp}
              merged['parameters'] = {**base['parameters'], **exp.get('parameters', {})}
              merged['experiment'] = os.path.basename(exp_file).replace('.yaml', '')
              jsonschema.validate(merged, schema)
          "

      - name: Run Snakemake dry-run
        run: uv run snakemake --config experiment=test_dummy -n

  test:
    name: End-to-End Pipeline & Assertions
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Set up Conda/Mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          mamba-version: "*"
          channels: conda-forge,bioconda,nodefaults
          python-version: "3.12"

      - name: Cache Snakemake Conda Environments
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          key: snakemake-conda-${{ runner.os }}-${{ hashFiles('workflow/envs/**') }}
          restore-keys: |
            snakemake-conda-${{ runner.os }}-

      - name: Install Snakemake and plugins
        run: uv sync

      - name: Run tests
        run: ./tests/run.sh

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-logs
          path: |
            .snakemake/log/
            results/test_dummy/notebooks/
          retention-days: 7
