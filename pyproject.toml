[project]
name = "genetic-risk-and-tads"
version = "0.1.0"
description = "Snakemake pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "snakemake>=9.19.0",
    "snakemake-storage-plugin-cached-http",
    "snakemake-storage-plugin-ftp>=0.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "snakefmt>=1.0.0",
]

[tool.uv.sources]
snakemake-storage-plugin-cached-http = { git = "https://github.com/PyPSA/snakemake-storage-plugin-cached-http" }
