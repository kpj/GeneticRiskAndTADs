[project]
name = "genetic-risk-and-tads"
version = "0.1.0"
description = "Snakemake pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "snakemake>=9.19.0",
    "snakemake-storage-plugin-cached-http",
    "snakemake-storage-plugin-ftp>=0.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "snakefmt>=1.0.0",
]

[tool.uv.sources]
snakemake-storage-plugin-cached-http = { git = "https://github.com/PyPSA/snakemake-storage-plugin-cached-http" }

[tool.ruff]
line-length = 88
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# F821: undefined name (snakemake is injected by snakemake)
# E501: line too long
extend-ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
"workflow/scripts/*.py" = ["F821"]
"workflow/notebooks/*.ipynb" = ["F821"]

[tool.snakefmt]
line_length = 88
include = '\.smk$|^Snakefile'
